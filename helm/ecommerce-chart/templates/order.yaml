apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: {{ .Values.order.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: {{ .Values.order.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.order.port }}
        env:
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-service:{{ .Values.inventory.port }}"
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.order.port }}
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
  - protocol: TCP
    port: {{ .Values.order.port }}
    targetPort: {{ .Values.order.port }}
  type: NodePort
