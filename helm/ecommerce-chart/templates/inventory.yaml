apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: {{ .Values.inventory.replicaCount }}
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: {{ .Values.inventory.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.inventory.port }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.inventory.port }}
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
  - protocol: TCP
    port: {{ .Values.inventory.port }}
    targetPort: {{ .Values.inventory.port }}
  type: ClusterIP
